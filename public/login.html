<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Cuotas Escolares Santa Cruz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b1120; color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
    
    <!-- Logo & Header -->
    <div class="text-center space-y-2">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-slate-950 font-bold text-2xl mx-auto shadow-lg shadow-emerald-500/20">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-tight">Acceso al Sistema</h1>
      <p class="text-xs text-slate-400">Plataforma de Control de Cuotas Escolares con IA</p>
    </div>

    <!-- QUICK ROLES TEST BUTTONS -->
    <div class="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 space-y-2 text-xs">
      <span class="text-slate-400 font-semibold block text-[11px] text-center">⚡ Clic para probar credenciales rápidas:</span>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="fillLogin('admin@cuotas.bo', 'admin123')" class="bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/30 p-2 rounded-xl text-center transition">
          <i class="fa-solid fa-crown block text-sm mb-0.5"></i>
          <span class="font-bold block">Super Admin</span>
          <span class="text-[9px] text-slate-400">Daniel Simons</span>
        </button>
        <button onclick="fillLogin('carmen@colegiosantacruz.bo', 'carmen123')" class="bg-slate-800 hover:bg-slate-700 text-emerald-300 border border-emerald-500/30 p-2 rounded-xl text-center transition">
          <i class="fa-solid fa-user-tie block text-sm mb-0.5"></i>
          <span class="font-bold block">Directivo</span>
          <span class="text-[9px] text-slate-400">Presidenta 3ro B</span>
        </button>
      </div>
    </div>

    <!-- Form -->
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
      <div>
        <label class="block font-semibold text-slate-300 mb-1.5">Correo Electrónico *</label>
        <div class="relative">
          <i class="fa-regular fa-envelope absolute left-3.5 top-3 text-slate-500"></i>
          <input type="email" id="email" required placeholder="correo@ejemplo.com"
            class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-10 pr-3.5 py-2.5 text-white focus:outline-none focus:border-emerald-500">
        </div>
      </div>

      <div>
        <label class="block font-semibold text-slate-300 mb-1.5">Contraseña *</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-500"></i>
          <input type="password" id="password" required placeholder="••••••••"
            class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-10 pr-3.5 py-2.5 text-white focus:outline-none focus:border-emerald-500">
        </div>
      </div>

      <div id="error-msg" class="hidden text-rose-400 text-center font-semibold text-xs py-1"></div>

      <button type="submit" id="btn-submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
        <span>Ingresar al Panel</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </form>

    <div class="text-center pt-2">
      <a href="/" class="text-xs text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-arrow-left mr-1"></i> Ir al Portal Público de Padres
      </a>
    </div>

  </div>

  <script>
    function fillLogin(email, pwd) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pwd;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error-msg');
      const btn = document.getElementById('btn-submit');

      errorEl.classList.add('hidden');
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Verificando...`;
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success && data.token) {
          localStorage.setItem('cuotas_token', data.token);
          localStorage.setItem('cuotas_user', JSON.stringify(data.user));

          if (data.user.role === 'SUPER_ADMIN') {
            window.location.href = '/admin-maestro.html';
          } else {
            window.location.href = '/directivo.html';
          }
        } else {
          errorEl.innerText = data.error || 'Credenciales incorrectas.';
          errorEl.classList.remove('hidden');
          btn.innerHTML = `<span>Ingresar al Panel</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
          btn.disabled = false;
        }
      } catch (err) {
        errorEl.innerText = 'Error de conexión con el servidor.';
        errorEl.classList.remove('hidden');
        btn.innerHTML = `<span>Ingresar al Panel</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
